schema_version = "1.4"
mode = "e2e"
artifacts = ["/output/poc.bin", "/output/fix.patch"]

[task]
version = "1.0.0"
uuid_v5 = "42d756c8-abda-48ce-a4a1-5fc887d53386"
authors = [
    { name = "Sagar Agrahari", email = "sagar.agrahari@ethara.ai" },
    { name = "Pratham Shukla", email = "pratham.shukla@ethara.ai" },
    { name = "Umang Kumar", email = "umang.kumar@ethara.ai" },
    { name = "Panjak Kumar", email = "panjak.kumar1152@ethara.ai" },
    { name = "Faiz Khan", email = "faiz.khan26@ethara.ai" },
    { name = "Smriti Singh", email = "smriti.singh@ethara.ai" },
    { name = "Madhushree Ray", email = "madhushree.ray1995@ethara.ai" },
    { name = "Rajni Kant", email = "rajni.kant@ethara.ai" },
    { name = "Krishna Kaushal", email = "krishna.Kaushal@ethara.ai" },
]
name = "ethara/rekor-cve-2026-48702"
description = "Find and fix an unbounded decompression bug in rekor's Alpine package parser."

[metadata]
category = "Security"
repo = "rekor"
language = "go"
kind = "vulnerability_discovery_and_patch"

[verifier]
network_mode = "no-network"

[agent]
# Inference needs the model API reachable during agent.run(); everything
# else stays shut, so the CVE advisory is still out of reach and the
# test_negative_weight_uses_network detector keeps its meaning.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]
timeout_sec = 5400

[environment]
# Baseline applies to agent.setup(), which installs the agent harness
# (apt/node/npm or pip). [agent] governs agent.run(). allow_internet is
# deprecated in the current schema in favour of network_mode.
network_mode = "public"
dockerfile = "environment/Dockerfile"
config = "environment/config/config.toml"
environment_mode = "separate"

[leak_gate]
# Bound at sign-off so containment is graded under the domain this bundle
# declared. The Dockerfile build context is environment/, so solution/ and
# tests/ are outside it and cannot be COPYd into the image; this gate measures
# that claim rather than restating it. Measured worst containment 0.1998,
# carried by TRUTH.md, which quotes instruction.md verbatim in its "task given
# to the agent" section -- visible text appearing inside a private document,
# which is the harmless direction.
private_carriers = ["TRUTH.md", "solution/TRUTH.md", "solution/fix.patch", "solution/poc.bin", "solution/crash.log", "tests/data/poc.bin"]
agent_visible_roots = ["environment", "instruction.md"]
ngram_width = 8
normalization = "casefold; collapse all runs of non-alphanumeric to a single space; strip leading and trailing space"
containment_threshold = 0.30
measured_worst_containment = 0.1998

[leak_gate.carrier_exclusions]
"tests/validate.py" = "Not staged into the image -- instruction.md states outright that this image ships no validate.py -- and not answer-bearing: the held-out inputs live in tests/data/, which IS in the private set. It orchestrates replay and declares the immutable path list."
"tests/test.sh" = "The verifier entrypoint. Not copied into the image and never seen by the agent, but it carries no answer content: it drives the oracle and scores the result."
"tests/test_output.py" = "The graded oracle. Not staged. It encodes which relations are graded rather than the answer to them; the withheld reproducers it reads are in tests/data/."
"tests/test_weights.json" = "Test names and weights only, no answer content."
"tests/rubric.json" = "The judged criteria. Criterion text describes what a correct answer must show, which is weaker than the answer itself."
"solution/solve.sh" = "Publishes the two artifacts to /output and nothing else; it carries no answer content of its own."

[verifier.robustness]
# Trial counts bound by the bundle so the stability and flakiness relations have
# an N the auditor did not choose. Kept small deliberately: each trial is a full
# rebuild and re-grade.
stability_trials = 2
flakiness_trials = 2
