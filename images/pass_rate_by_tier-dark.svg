  <text x="130" y="876" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="16" fill="#9fc4bc">every point is one bundle's own reward_mean; nothing is averaged across bundles</text>
