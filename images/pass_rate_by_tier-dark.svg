  <line x1="130" y1="330.0" x2="1540" y2="330.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="114" y="337.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">45%</text>
  <line x1="130" y1="210.0" x2="1540" y2="210.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="114" y="217.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">60%</text>
  <line x1="130" y1="690.0" x2="1540" y2="690.0" stroke="rgba(190,225,218,0.38)" stroke-width="2"/>
