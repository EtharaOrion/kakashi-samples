schema_version = "1.4"
mode = "e2e"
artifacts = ["/output/poc.bin", "/output/fix.patch"]

[task]
uuid_v5 = "6e02e468-4f80-4fa7-96aa-2c3b0db7c14e"
authors = [
    { name = "Sagar Agrahari", email = "sagar.agrahari@ethara.ai" },
    { name = "Pratham Shukla", email = "pratham.shukla@ethara.ai" },
    { name = "Umang Kumar", email = "umang.kumar@ethara.ai" },
    { name = "Panjak Kumar", email = "panjak.kumar1152@ethara.ai" },
    { name = "Faiz Khan", email = "faiz.khan26@ethara.ai" },
    { name = "Smriti Singh", email = "smriti.singh@ethara.ai" },
    { name = "Madhushree Ray", email = "madhushree.ray1995@ethara.ai" },
    { name = "Rajni Kant", email = "rajni.kant@ethara.ai" },
    { name = "Krishna Kaushal", email = "krishna.Kaushal@ethara.ai" },
]
name = "ethara/sqlite3-cve-2024-0232"
description = "Diagnose and patch a use-after-free defect in an embedded database engine's JSON extension [e2e]."
version = "1.0.0"
keywords = ["security", "c", "use-after-free", "memory-safety", "e2e"]

[agent]
# Migrated from the 1.0 spelling `network = false`, which Harbor 0.3.0 replaced.
network_mode = "no-network"
timeout_sec = 5400
workspace = "/root/workspace"

[environment]
dockerfile = "environment/Dockerfile"
# Migrated from the deprecated `allow_internet = false` spelling, which schema
# 1.4 replaced with `network_mode`. `no-network` is the explicit posture Harbor
# derives from the old boolean, matching `[agent]` and `[verifier]` here.
network_mode = "no-network"

[verifier]
# The 1.0 file declared no verifier network posture at all. Stated explicitly
# here, matching the sibling bundles and the `[environment].network_mode` above.
network_mode = "no-network"
timeout_sec = 7200
entrypoint = "tests/test.sh"
reward_file = "/logs/verifier/reward.txt"

[verifier.weights]
file = "tests/test_weights.json"
# reward = sum(passed weights) / sum(positive weights), clamped to [-1, 1]
normalize = "positive_sum"
clamp = [-1.0, 1.0]

[rubric]
# The judged channel: `file` holds the judged semantic criteria under an R vocabulary,
# disjoint from the weighted deterministic tests. Where a judged criterion is in fact
# decided deterministically, the rubric item carries `compiled = true` and names its
# `deterministic_counterpart` in tests/test_weights.json, which is the linkage between them.
file = "tests/rubric.json"
channel_relation = "disjoint"
compiled_linkage = "rubric item field deterministic_counterpart"

[metadata]
mode = "e2e"
language = "c"
task_id = "CVE-2024-0232"

[leak_gate]
# Bound at sign-off so the auditor grades containment under the domain this bundle
# declared, rather than under a threshold the auditor chose for itself. The private
# carriers are the answer-bearing files; the agent-visible surface is what the image
# actually stages, which is the environment/ build context and instruction.md.
private_carriers = ["solution/truth.md", "solution/fix.patch", "solution/poc.bin", "solution/crash.log", "tests/data/poc.bin", "TRUTH.md"]
agent_visible_roots = ["environment", "instruction.md"]
ngram_width = 8
normalization = "casefold; collapse all runs of non-alphanumeric to a single space; strip leading and trailing space"
containment_threshold = 0.30

[rubric.item_schema]
# Bound at sign-off so the auditor validates items against the schema this bundle
# declared, rather than against whatever schema happens to be installed. Derived from
# and consistent with the committed rubric.
required_fields = ["number", "criterion", "is_positive", "type", "evaluation_target", "importance", "score", "compiled", "evidence", "judged_because"]
optional_fields = ["deterministic_counterpart"]
# `deterministic_counterpart` is required exactly when `compiled` is true, which is the
# linkage between the judged channel and its deterministic mirror.
conditional_required = [["compiled", "deterministic_counterpart"]]
number_pattern = "^R[0-9]+$"
score_values = [-5, 1, 3, 5]
evidence_must_resolve_to_committed_file = true

[rubric.target_vocabulary]
evaluation_target = ["final_answer", "state_change", "trajectory", "user_facing_message"]
type = ["agent behavior", "factuality & hallucination", "safety & boundaries", "task completion", "tool use"]
importance = ["critically_important", "important"]

[rubric.compiled_weight]
# Share of rubric weight decided deterministically rather than judged. The measure is
# bound explicitly because it is load-bearing and the two natural readings disagree:
# over positive weights alone the share is 0.0000, because the single compiled item is
# a penalty; over absolute weights it is 0.0746. Absolute weight is the bound measure,
# since a compiled penalty is still compiled. The auditor recomputes the share from
# committed bytes and never accepts the declaration.
#
# The floor is low by design rather than by neglect. This is an e2e discovery task: the
# rubric IS the judged channel, and the deterministic work lives in the weighted tests at
# tests/test_weights.json under a separate vocabulary. Only
# R10, the immutable-harness penalty, reduces to a deterministic relation over committed
# artifacts, and it names its counterpart. Forcing a higher share here would mean
# compiling criteria that are irreducibly semantic, which is the defect G-RUB-RESIDUE
# exists to catch from the other direction.
#
# The floor itself is projected by ENGRAM and is deliberately NOT stated here. A
# bundle that declared its own floor would be grading itself, which is the same
# defect as an auditor authoring one. What stays is the measured share and the
# applicability determination, both of which the auditor recomputes from committed
# bytes and never accepts on the declaration.
measure = "positive_weight_share"
measured_at_signoff = 0.0
absolute_weight_share = 0.0746
floor_applicability = "not_applicable"
floor_applicability_reason = "channel_relation is disjoint. The judged channel grades response content and run trajectory; the deterministic channel grades state change. A criterion about what a response asserted has no deterministic counterpart to compile into, so a share floor over this design measures the design rather than a defect. G-RUB-RESIDUE remains the live control and is not relaxed: every judged item carries judged_because."

[verifier.robustness]
# Trial counts bound by the bundle so the stability and flakiness relations have an N
# the auditor did not choose for itself. Kept small deliberately: each trial is a full
# rebuild and re-grade, and an N nobody can afford to run is not a bound, it is a wish.
stability_trials = 2
flakiness_trials = 2

[leak_gate.carrier_exclusions]
# Every file the auditor's default private-carrier set contains that this bundle does
# NOT treat as private, with the reason. Recorded so the narrowing is auditable rather
# than silent: an unexplained narrowing of the private set is how a real carrier gets
# quietly dropped from the containment measurement.
"tests/validate.py" = "Deliberately staged into the image as /opt/harness/validate.py. instruction.md tells the agent to call it, so it is shared by design and its containment against the agent surface is 1.0 by construction rather than by leak."
"tests/test.sh" = "The verifier entrypoint. It is not copied into the image and the agent never sees it, but it also carries no answer content: it materialises a scorer and invokes pytest. Excluded because it is not answer-bearing, not because it is shared."
"tests/test_output.py" = "The graded oracle. Not staged into the image. It encodes which relations are graded rather than the answer to them, and the withheld reproducer it reads lives in tests/data/poc.bin, which IS in the private set."
"tests/rubric.json" = "The judged criteria. Criterion text describes what a correct answer must show, which is weaker than the answer; the answer itself lives in solution/truth.md, which IS in the private set."
"solution/TRUTH.md" = "A case variant of solution/truth.md, which is already in the private set. On a case-insensitive filesystem the two resolve to one file."
"tests/rubrics.json" = "Not committed by this bundle. The auditor default set names it for bundles that use the plural filename."

[verifier.perturbations]
# The invariance instrument replays the committed parser under each perturbation
# below and requires the derived verdict set to be unchanged. Declaring the domain at
# sign-off is what makes the instrument runnable at all.
line_order = true
section_indentation = true
suite_name_prefixes = true
ordinal_suffixes = true
timestamps = true
interleaved_output = true

[environment.image]
# The digest of the assembled image, so the closure the committed evidence executed
# under is nameable from committed bytes rather than only from the base digests.
# Recorded per architecture: a manifest-list tag resolves to a different image on each
# host, so naming one digest without naming its platform reads as a pin without being
# one. This leg is the one the committed dynamic evidence was measured on.
built_image_digest_arm64 = "sha256:09a49f4b1a92b7e0eac87cc7e4c5af1b7df7bc6aecf6a6c3149d2dfbb7597a93"
built_platform = "linux/arm64"
built_from = "environment/Dockerfile at the pinned base digests"
built_at = "2026-09-05"
